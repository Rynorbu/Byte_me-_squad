sonar.projectKey=Byte_me-_squad
sonar.organization=rynorbu
sonar.projectName=Byte Me Application (Vite + React)
sonar.projectVersion=1.0.0

# Source files
sonar.sources=src

# Test files (only if they exist)
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts,vite.config.ts

# Quality gates
sonar.qualitygate.wait=true

# Code analysis
sonar.typescript.tslint.configPath=eslint.config.js
