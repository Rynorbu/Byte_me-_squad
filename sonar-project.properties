sonar.projectKey=Byte_me-_squad
sonar.organization=ryrorbu
sonar.projectName=Byte Me Application (Vite + React)
sonar.projectVersion=1.0.0

# Source files
sonar.sources=src
sonar.tests=src/__tests__,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Test and coverage
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts,vite.config.ts

# Vite specific
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**

# Quality gates
sonar.qualitygate.wait=true

# Code analysis
sonar.typescript.tslint.configPath=eslint.config.js
