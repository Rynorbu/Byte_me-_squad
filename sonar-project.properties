sonar.projectKey=byte-me-app
sonar.projectName=Byte Me Application
sonar.projectVersion=1.0.0

# Source files
sonar.sources=src
sonar.tests=src/__tests__,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Test and coverage
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,.next/**,coverage/**,**/*.d.ts

# Next.js specific
sonar.exclusions=**/.next/**,**/node_modules/**,**/public/**

# Quality gates
sonar.qualitygate.wait=true

# Code analysis
sonar.typescript.tslint.configPath=eslint.config.js
